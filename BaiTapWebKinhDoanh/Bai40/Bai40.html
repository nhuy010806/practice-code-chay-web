<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
                table{
            border-collapse: collapse;
        }

        th,td{
            border:1px solid gray;
            padding:6px 10px;
        }

        thead{
            background:blue;
            color:white;
        }

        tbody tr:nth-child(odd){
            background:whitesmoke;
        }

        tbody tr:nth-child(even){
            background:pink;
        }

        tbody tr:hover{
            background:yellow;
            cursor:pointer;
        }

        tfoot td{
            background:blue ;
            color:white;
        }
    </style>
</head>

</html>
