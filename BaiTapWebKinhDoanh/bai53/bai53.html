<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let sinhvien = { // 🔴 SỬA Ở ĐÂY: Thêm từ khóa 'let' để khai báo biến
            Ma: 1,
            Ten: 'Trần Duy Thanh',
            Sachs: [
                {Ma:'S1',Ten:'Hồng Lâu Mộng',Trang:100},
                {Ma:'S2',Ten:'Tây Du Ký',Trang:200},
                {Ma:'S3',Ten:'Tam Quốc Chí',Trang:90},
                {Ma:'S4',Ten:'Bích Huyết Kiếm',Trang:70},
                {Ma:'S5',Ten:'Anh Hùng Xạ Điêu',Trang:1000},
                {Ma:'S6',Ten:'Thần Điêu Đại Hiệp',Trang:500},
                {Ma:'S7',Ten:'Tần Thủy Hoàng',Trang:600},
                {Ma:'S8',Ten:'Chiến Quốc',Trang:400},
                {Ma:'S9',Ten:'Hán Sở Tranh Hùng',Trang:300},
                {Ma:'S10',Ten:'Bảo Đao',Trang:700},
            ],
            ChiTiet: function(){
                return this.Ma + "_" + this.Ten
            }
        }
    </script>
</head>
<body>
    <table border="1">
        <tr>
            <td>Nhập Mã:</td>
            <td><input type="text" id="nhapma"></td>
        </tr>
         <tr>
            <td>Nhập Tên:</td>
            <td><input type="text" id="nhapten"></td>
        </tr>
         <tr>
            <td>Mã và Tên:</td>
            <td><input type="text" id="maten" readonly> <!-- 🔴 SỬA Ở ĐÂY: Thêm 'readonly' vì ô này chỉ hiển thị, không nên cho gõ --></td>
        </tr>
        <tr>
            <td colspan="2">Danh sách sách đang mượn: </td>
        </tr>
    </table>
    <table>
        <thead>
            <tr> <!-- 🔴 SỬA Ở ĐÂY: Thêm thẻ <tr> bao bọc các thẻ <th> cho chuẩn HTML -->
                <th>Mã sách</th>
                <th>Tên sách</th>
                <th>Số trang</th>
            </tr>
        </thead>
        <tbody id="result"></tbody>
    </table>
    
    <script>
        // 🔴 SỬA Ở ĐÂY: Thêm từ khóa 'let' trước các biến để khai báo đúng chuẩn
        let nhapma = document.getElementById("nhapma")
        let ten = document.getElementById("nhapten")
        let tbody = document.getElementById("result")

        // 🔴 SỬA Ở ĐÂY: Gọi hàm từ object sinhvien (sinhvien.ChiTiet()) thay vì gọi ChiTiet() đứng một mình
        // Đồng thời xóa bớt 1 dòng gán trùng lặp ở code cũ của bạn
        document.getElementById("maten").value = sinhvien.ChiTiet()

        function showProduct(ds){
            tbody.innerHTML = ""
            // 🔴 SỬA Ở ĐÂY: Đổi 'ds.Sachs' thành 'ds'. Vì dữ liệu truyền vào hàm (là sinhvien.Sachs hoặc mảng ketqua) vốn đã là 1 mảng rồi.
            // Và thêm 'let' trước 'hs'
            for(let hs of ds){ 
                let tr = document.createElement("tr") // Thêm let

                let td1 = document.createElement("td") // Thêm let
                td1.innerText = hs.Ma

                let td2 = document.createElement("td") // Thêm let
                td2.innerText = hs.Ten

                let td3 = document.createElement("td") // Thêm let
                td3.innerText = hs.Trang

                tr.appendChild(td1)
                tr.appendChild(td2)
                tr.appendChild(td3)

                tbody.appendChild(tr)
            }
        } // 🔴 SỬA Ở ĐÂY: Di chuyển dấu ngoặc nhọn '}' đóng hàm showProduct từ cuối trang lên đây.

        showProduct(sinhvien.Sachs)

        // 🔴 SỬA Ở ĐÂY: Đổi tên sự kiện từ "nhapma" (không tồn tại) thành "input" (khi người dùng gõ phím)
        nhapma.addEventListener("input", function(){
            let keyword = nhapma.value.toLowerCase().trim()
            
            let ketqua = sinhvien.Sachs.filter(function(item){
                return item.Ma.toLowerCase().includes(keyword)
            })

            showProduct(ketqua)
        })

    </script>
</body>
</html>
