<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var dataset = ["Cá phê", "Tiêu", "Điều"]
    </script>
</head>
<body>
    <ol id="myol">

    </ol>
    <script>
        ol = document.getElementById("myol")
        for(i=0; i<dataset.length; i++){
            item = dataset[i]
            li=document.createElement("li"); 
            // Bước 3: Thiết lập thuộc tính cho element
            li.innerText = item 
            // Bước 4: 
            ol.appendChild(li)
        }
    </script>
    
</body>
</html>
