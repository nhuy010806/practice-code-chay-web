<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemoJsonHTML</title>
    <script type="text/javascript">
         dataset = {
            "id": 1000, 
            "name": "Máy tính", 
            "products": [
                {"id": 1, "name": "Dell Insprion 15", "price": 1500}, 
                {"id": 2, "name": "Macbook Pro 2020", "price": 2500}, 
                {"id": 3, "name": "HP Pavilion 15", "price": 1200}, 
                {"id": 4, "name": "Asus Vivobook 15", "price": 1300}
            ]
         }
    </script>
</head>
<body>
    <table border="1">
        <tr>
            <td>Cate ID: </td>
            <td id="cateid"></td>
        </tr>
        <tr>
            <td>Cate Name: </td>
            <td id="catename"></td>
        </tr>
    </table>
    <script>
        document.getElementById("cateid").innerHTML = dataset.id
        document.getElementById("catename").innerHTML = dataset.name
    </script>  
    <table border="1"> 
         <caption>List Products</caption>
         <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Price</th>
            </tr>
         </thead>
         <tbody id="productBody">

         </tbody>
    </table>
    <script>
       productbody = document.getElementById("productBody")
       for(i=0; i<dataset.products.length; i++){
            product = dataset.products[i]
            tr = document.createElement("tr")
            productbody.appendChild(tr)
             td = document.createElement("td")
             td.innerText = product.id
             tr.appendChild(td)
             td = document.createElement("td")
             td.innerText = product.name
             tr.appendChild(td)
             td = document.createElement("td")
             td.innerText = product.price
             tr.appendChild(td)
       }
    </script> 
</body>
</html>
