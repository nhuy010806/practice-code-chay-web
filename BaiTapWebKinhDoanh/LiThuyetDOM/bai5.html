<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE DEMO DOM REMOVE</title>
    <script>
        function addProduct() {
            tbody= document.getElementById("tablebody")

            tr = document.createElement("tr")

            tdProductId=document.createElement("td")
            tdProductId.innerHTML = document.getElementById("productid").value 

            tr.appendChild(tdProductId)

            tdProductName=document.createElement("td")
            tdProductName.innerHTML = document.getElementById("productname").value 
            
            tr.appendChild(tdProductName)

            tdUnitPrice=document.createElement("td")
            tdUnitPrice.innerHTML = document.getElementById("unitprice").value 
            
            tr.appendChild(tdUnitPrice)

            tdimg = document.createElement("td")
            img = document.createElement("img")
            img.setAttribute("src", "trash.png")
            img.setAttribute("width", 32)
            img.setAttribute("height", 32)
            img.setAttribute("style", "cursor: pointer")
            img.setAttribute("title", "Click on the icon to remove the rows")

            img.onclick=function() {
                tbody.removeChild(this.parentElement.parentElement)
            }

            tdimg.appendChild(img)
            tr.appendChild(tdimg)

            tbody.appendChild(tr)

        }
    </script>
</head>
<body>
    <form name="frmProduct">
        <table border=1>
            <tr>
                <td>Product Id:</td>
                <td>
                    <input type="text" id="productid">
                </td>
            </tr>
            <tr>
                <td>Product Name:</td>
                <td>
                    <input type="text" id="productname">
                </td>
            </tr>
            <tr>
                <td>Unit price:</td>
                <td>
                    <input type="text" id="unitprice">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                      <button type="button" onClick="addProduct()">Add Product</button>
                </td>
            </tr>
        </table>
    </form>
    <table border="1">
        <caption>List product: </caption>
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Unit Price</th>
                <th>#</th>
            </tr>
        </thead>
        <tbody id="tablebody">
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" >Designed by [Tèo Mộng Mơ]</td>
            </tr>
        </tfoot>
        
    </table>
    
</body>
</html>
