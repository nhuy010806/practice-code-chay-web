<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function xulyGiai(a,b, ketqua){
           // ax+b =0 
           //x=-b/a 
           ketqua.value = pt(a,b)
        }
        function pt(a,b) {
            c = -eval(b)/eval(a)
            return c
        }
    </script>
</head>
<body>
    <form> 
        <table>
            <tr>
                <td colspan="2">Phương trình bậc 1: </td>
            </tr>
            <tr>
                <td>Hệ số a: </td>
                <td>
                    <input type="text" id="hsa">
                </td>
            </tr>
            <tr>
                <td>Hệ số b: </td>
                <td>
                    <input type="text" id="hsb">
                </td>
            </tr>
            <tr>
                <td>Kết quả: </td>
                <td>
                    <input type="text" id="ketqua" >
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="button" value="Giai" onClick="xulyGiai(hsa.value, hsb.value, ketqua)">
                    &nbsp;
                    <input type="button" value="Thoat"
                </td>
            </tr>
        </table>
    </form>

    
</body>
</html>
