<html lang="en">
<head>

    <title>Document</title>
    <style>
        table{
             border-collapse: collapse;
                }

        th,td{
            border:1px solid gray;
            padding:6px 10px;
        }
         thead tr th{
            background-color: blue;
            color: white; 
         }
         tbody tr:nth-child(2n+1) {

         }
         tbody tr:nth-child(2n){
            background-color: cyan;
         }
         tfoot tr td{
            background-color: blue;
         }

    </style>
</head>

         </tr>
